# Reference copy of the live nginx config for namelab.sebk.no.
# Plain static files; get the certificate first (certbot certonly --nginx -d namelab.sebk.no).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name namelab.sebk.no;

    ssl_certificate     /etc/letsencrypt/live/namelab.sebk.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namelab.sebk.no/privkey.pem;

    root /srv/http/namelab;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # fonts only change if fetch-fonts.sh changes
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name namelab.sebk.no;
    return 301 https://$host$request_uri;
}
